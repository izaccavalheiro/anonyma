[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "anonyma"
description = "PII detection and anonymization for Python on a Rust core: checksum-verified detectors, reversible prompt shielding for LLMs, compliance presets and signed receipts. No runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Izac Cavalheiro" }]
keywords = ["pii", "anonymization", "privacy", "redaction", "llm", "gdpr", "lgpd", "hipaa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Security",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
langchain = ["langchain-core>=0.3"]

[project.urls]
Homepage = "https://izaccavalheiro.github.io/anonyma/"
Repository = "https://github.com/izaccavalheiro/anonyma"
Issues = "https://github.com/izaccavalheiro/anonyma/issues"

[tool.maturin]
module-name = "anonyma._native"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
