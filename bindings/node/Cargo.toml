[package]
name = "anonyma-node"
description = "Node.js and Bun bindings of anonyma-core (napi-rs)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# Batches spread over every core (rayon), outside the JavaScript thread.
anonyma-core = { workspace = true, features = ["parallel"] }
anonyma-ffi = { path = "../../crates/anonyma-ffi", default-features = false }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
