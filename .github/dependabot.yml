# Dependency updates.
#
# A new version is proposed a week after it was published, which keeps a
# freshly compromised release out of the lockfile. Security updates are not
# delayed.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      # One pull request for the routine updates of the tooling; a new major
      # version comes on its own.
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
