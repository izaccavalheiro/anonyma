# Continuous integration.
#
# Every job answers one question, so a red run says what is wrong:
#
#   static        Does the code type-check, lint and follow the format?
#   test          Do the tests pass on every maintained Node.js line and OS?
#   coverage      Is the code still covered above the thresholds?
#   package       Is what would be published a valid dual ESM/CJS package, within its size budget?
#   smoke         Does the packed tarball work for a consumer, down to Node.js 18?
#   runtimes      Does the built package work on Bun, Deno and Cloudflare Workers?
#   packages      Do @anonyma/vercel-ai and @anonyma/mcp type-check, pass and pack?
#   performance   Is the span engine still linear in the size of its input?
#   privacy       Do the privacy invariants and the compliance suites hold (GDPR, LGPD)?
#   supply-chain  Are the dependencies free of known vulnerabilities and correctly signed?
#
# `CI` at the end is the one status to require in a branch protection rule.
#
# All actions are pinned to a commit; Dependabot keeps the pins current.

name: CI

on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
    branches: [main, dev, "release/**"]
  merge_group:
  workflow_dispatch:
  # The release workflow runs this pipeline before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git hooks are for contributors' machines.
  HUSKY: "0"

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Commit messages of the whole pull request are linted.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  test:
    name: Test (Node.js ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        node: [20, 22, 24, 26]
        include:
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The thresholds are in vitest.config.ts; the run fails below them.
      - name: Run the tests with coverage
        run: npm run test:coverage

      - name: Summarise
        if: always()
        run: |
          node -e '
            const { total } = JSON.parse(require("node:fs").readFileSync("coverage/coverage-summary.json", "utf8"));
            const row = (name) => `| ${name} | ${total[name].pct} % | ${total[name].covered} / ${total[name].total} |`;
            console.log(["### Coverage", "", "| Metric | Covered | Count |", "| --- | ---: | ---: |", ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  package:
    name: Build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # publint checks the package against what Node.js and bundlers expect;
      # are-the-types-wrong checks that every entry point resolves to the
      # right types from CommonJS, from ES modules and from a bundler.
      - name: Validate the package
        run: npm run check:package

      - name: Check the size budget
        run: npm run check:size

      - name: Pack
        run: npm pack --ignore-scripts

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: anonyma-*.tgz
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke (Node.js ${{ matrix.node }})
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every line the package declares to support, oldest first. The
        # development tooling no longer runs on Node.js 18; the package must.
        node: [18, 20, 22, 24, 26]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # Installs the tarball into an empty project and uses it as a consumer
      # would: every entry point through import and require, then the features.
      - name: Install and use the package
        run: node scripts/smoke.mjs anonyma-*.tgz

  runtimes:
    name: Runtime (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, workerd]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The same checks on every runtime (scripts/runtime/checks.mjs): they
      # import dist/ directly and use nothing but the Web platform.
      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Run the checks on Bun
        if: matrix.runtime == 'bun'
        run: bun scripts/runtime/run.mjs

      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # No permission flags: the package needs no file, network or env access.
      - name: Run the checks on Deno
        if: matrix.runtime == 'deno'
        run: deno run --no-config scripts/runtime/run.mjs

      # Miniflare runs workerd, the runtime of Cloudflare Workers, locally. It
      # is not a development dependency: it brings a large native binary.
      - name: Install Miniflare
        if: matrix.runtime == 'workerd'
        run: npm install --no-save --no-audit --no-fund miniflare@4

      # The worker is bundled with esbuild as `wrangler deploy` does, and runs
      # without the nodejs_compat flag.
      - name: Run the checks on Cloudflare Workers
        if: matrix.runtime == 'workerd'
        run: node scripts/runtime/workerd.mjs

  packages:
    name: Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The packages import anonyma through its export map, from this build.
      - name: Build anonyma
        run: npm run build

      - name: Type-check
        run: npm run typecheck:packages

      # Against the real Vercel AI SDK and MCP SDK, not stand-ins.
      - name: Test
        run: npm run test:packages

      - name: Build the packages
        run: npm run build:packages

      - name: Validate the packages
        run: npm run check:packages

  performance:
    name: Performance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run the benchmark
        run: node bench/run.mjs --quick --json "$RUNNER_TEMP/benchmark.json"

      # Timings on a shared runner are noise. How time grows with input size
      # is not: the check fails when an engine operation stops being linear.
      - name: Check scaling
        run: node scripts/check-bench.mjs "$RUNNER_TEMP/benchmark.json"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark
          path: ${{ runner.temp }}/benchmark.json
          retention-days: 30

  privacy:
    name: Privacy and compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Privacy by design (GDPR Art. 25, LGPD Art. 46): no third-party code
      # runs on the data, the data stays in the process, only the built
      # package is published, and the repository holds synthetic data only.
      - name: Check the privacy invariants
        run: npm run check:privacy -- --require-dist

      # The suites that keep the legal mapping and the guarantees honest:
      # regulation profiles and their citations, the built-in presets against
      # those profiles, erasure, the audit trail without personal data, and
      # the precision and recall floors of the detectors.
      - name: Run the compliance suites
        env:
          ANONYMA_PRECISION_REPORT: "1"
        run: >-
          npx vitest run
          tests/compliance
          tests/audit
          tests/presets.test.ts
          tests/vault
          tests/engine/precision.test.ts
          tests/engine/properties.test.ts

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # What a consumer installs. The package has no runtime dependencies, so
      # any finding here is a regression.
      - name: Audit what is shipped
        run: npm audit --omit=dev

      # The tooling that builds and tests the package.
      - name: Audit the development tooling
        run: npm audit --audit-level=high

      - name: Verify registry signatures and provenance
        run: npm audit signatures

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails a pull request that adds a dependency with a known vulnerability
      # or with a licence that a permissively licensed library cannot carry.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure

  ci:
    name: CI
    if: always()
    needs:
      - static
      - test
      - coverage
      - package
      - smoke
      - runtimes
      - packages
      - performance
      - privacy
      - supply-chain
      - dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A skipped job is fine (dependency review outside pull requests); a
      # failed or cancelled one is not.
      - name: Require every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job ended with: $result"
              exit 1
            fi
          done
