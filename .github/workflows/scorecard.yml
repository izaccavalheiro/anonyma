# OpenSSF Scorecard: an outside measure of the project's supply-chain
# practices (pinned actions, token permissions, branch protection, signed
# releases, and so on). Results go to the code scanning tab and to
# https://scorecard.dev.
#
# Scorecard only analyses the default branch.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 2"
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Upload of the results to the code scanning tab.
      security-events: write
      # Publication of the results.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 14

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
