# Release.
#
# A version is published from GitHub, never from a laptop: push a tag
# `v<version>` that matches package.json, and this workflow
#
#   1. runs the whole CI pipeline on the tagged commit,
#   2. runs the package's own publish gate and packs the tarball,
#   3. publishes it to npm with a provenance attestation
#      (a version with a prerelease suffix goes to the `next` dist-tag, any
#      other to `latest`),
#   4. attests the tarball on GitHub and creates the GitHub release with the
#      changelog section, the tarball and a CycloneDX SBOM.
#
# A pre-release may be tagged on a release branch; a stable version must be
# tagged on a commit of `main`.
#
# Running it by hand from the Actions tab rehearses everything but step 3
# and 4: nothing is published.
#
# The publish job runs in the `npm` environment, which only accepts version
# tags. npm trusts this workflow as a publisher through OpenID Connect, so no
# registry credential is stored anywhere.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # Requested by the dependency review job, which only runs on pull requests.
      pull-requests: write

  rehearse:
    name: Rehearse the release
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the publish gate
        run: npm run prepublishOnly

      - name: Pack
        run: npm pack --ignore-scripts

      - name: Publish (dry run)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: npm publish "anonyma-$VERSION.tgz" --dry-run --access public --tag "$DIST_TAG"

  publish:
    name: Publish to npm
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/anonyma/v/${{ steps.version.outputs.version }}
    permissions:
      # The GitHub release.
      contents: write
      # npm provenance, npm trusted publishing and the GitHub attestation.
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history of main, to check where a stable version was tagged.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # A release is built from a clean install, not from a cache.
          package-manager-cache: false

      # Provenance and trusted publishing need npm 11.5.1 or newer.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Check the version against the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match the version in package.json ($version)."
            exit 1
          fi
          if npm view "anonyma@$version" version > /dev/null 2>&1; then
            echo "::error::anonyma@$version is already on the registry."
            exit 1
          fi
          case "$version" in
            *-*)
              echo "dist_tag=next" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # `latest` is what every `npm install anonyma` gets, so it is only
      # published from what was merged.
      - name: Require a stable version to be on main
        if: steps.version.outputs.prerelease == 'false'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is a stable version, but the tagged commit is not on main. Merge first, then tag the merged commit."
            exit 1
          fi

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      # Type check, lint, tests and build: the gate the package defines for itself.
      - name: Run the publish gate
        run: npm run prepublishOnly

      - name: Pack
        run: npm pack --ignore-scripts

      # npm exchanges the job's OpenID Connect token for a short-lived
      # publish token (trusted publishing); there is no stored credential.
      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: npm publish "anonyma-$VERSION.tgz" --provenance --access public --tag "$DIST_TAG"

      - name: Write the SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm sbom --sbom-format cyclonedx --omit dev > "anonyma-$VERSION.cdx.json"

      - name: Attest the tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: anonyma-${{ steps.version.outputs.version }}.tgz

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags="--latest"
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease --latest=false"; fi
          # shellcheck disable=SC2086 # the flags are two words on purpose
          gh release create "$TAG" \
            "anonyma-$VERSION.tgz" \
            "anonyma-$VERSION.cdx.json" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $flags
